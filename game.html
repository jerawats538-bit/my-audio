<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corporate Snake & Ladders</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      color: white;
      overflow-x: hidden;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: white;
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .status {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-blue { width: 10px; height: 10px; border-radius: 50%; background: #818cf8; }
    .dot-pink { width: 10px; height: 10px; border-radius: 50%; background: #fb7185; }
    
    .board-wrapper {
      background: #1a2332;
      border-radius: 16px;
      padding: 8px;
      border: 2px solid #334155;
      position: relative;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      aspect-ratio: 1/1;
      gap: 2px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      border-radius: 2px;
      font-weight: 700;
      font-size: 10px;
      color: #1e293b;
    }
    .cell.light { background: #f8fafc; }
    .cell.dark { background: #e2e8f0; }
    .cell.ladder { background: #a7f3d0 !important; border: 1px solid #34d399; }
    .cell.snake { background: #fca5a5 !important; border: 1px solid #f87171; }
    .cell .num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 8px;
      opacity: 0.6;
      font-weight: 600;
    }
    .cell .icon {
      font-size: 14px;
      line-height: 1;
      z-index: 2;
    }
    .cell .label {
      position: absolute;
      bottom: 1px;
      font-size: 7px;
      opacity: 0.7;
      background: rgba(0,0,0,0.06);
      padding: 0 2px;
      border-radius: 2px;
    }
    .token-player {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #4f46e5;
      border: 2px solid white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(79,70,229,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: white;
      transition: all 0.3s ease;
    }
    .token-ai {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #e11d48;
      border: 2px solid #fecdd3;
      border-radius: 50%;
      bottom: 2px;
      right: 2px;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(225,29,72,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: white;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .controls {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .controls .msg {
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .dice-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #dice {
      width: 54px;
      height: 54px;
      background: #f1f5f9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 2px solid #94a3b8;
      box-shadow: inset 0 -4px 0 #94a3b8;
      color: #0f172a;
    }
    #rollBtn {
      flex: 1;
      padding: 12px 18px;
      background: linear-gradient(145deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79,70,229,0.4);
      transition: all 0.2s;
    }
    #rollBtn:active:not(:disabled) {
      transform: scale(0.98);
    }
    #rollBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal Styling - Optimized for Mobile Overlay and Fullscreen Video */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-overlay.active { display: flex; }
    
    #videoModal .modal-box {
      background: #0f172a;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #334155;
      overflow-y: auto;
    }
    
    .video-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .video-wrap {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      width: 100%;
      margin: 8px 0;
      position: relative;
      border: 1px solid #334155;
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .btn-close {
      width: 100%;
      padding: 14px;
      background: linear-gradient(145deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn-close:active {
      transform: scale(0.98);
    }

    #resultModal .modal-box {
      background: #1e293b;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #475569;
    }

    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red { background: #fecaca; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-pink { background: #fce7f3; color: #9d174d; }
    
    .btn-action {
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
      font-size: 14px;
      transition: all 0.2s;
    }
    .bg-emerald { background: #059669; color: white; }
    .bg-indigo { background: #4f46e5; color: white; }
    .bg-rose { background: #e11d48; color: white; }
    
    .connector {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    
    .lb-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏢 Corporate Edutainment</h1>
  <p class="subtitle">เกมบันไดเรียนรู้กฎระเบียบองค์กร</p>

  <div class="status">
    <div class="status-item">
      <div class="dot-blue"></div>
      <span>ผู้เล่น: <b id="pPos">1</b></span>
    </div>
    <div class="status-item">
      <div class="dot-pink"></div>
      <span>AI: <b id="aPos">1</b></span>
    </div>
    <div>รอบที่: <b id="turnCount">1</b></div>
  </div>

  <div class="board-wrapper">
    <div id="board"></div>
  </div>

  <div class="controls">
    <div class="msg" id="msg">🎯 ตาของคุณแล้ว! แตะปุ่มเพื่อทอยลูกเต๋า</div>
    <div class="dice-area">
      <div id="dice">🎲</div>
      <button id="rollBtn" onclick="playTurn()">ทอยลูกเต๋า</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="videoModal">
  <div class="modal-box">
    <div class="video-header">
      <div id="vBadge" class="badge"></div>
      <div id="vTag" class="badge"></div>
    </div>
    <h3 id="vTitle" style="color: white; font-size: 16px; margin-bottom: 4px;"></h3>
    <p id="vDesc" style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;"></p>
    
    <div class="video-wrap" id="vContainer"></div>
    
    <button class="btn-close" id="ackBtn" onclick="closeVideo()">รับทราบและเดินต่อ ➔</button>
  </div>
</div>

<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div style="text-align: center; margin-bottom: 15px;">
      <div style="font-size: 48px;" id="winnerIcon">🏆</div>
      <h2 id="winnerTitle" style="color: white; font-size: 20px; margin-top: 5px;"></h2>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;" id="winnerSub"></p>
    </div>

    <div id="formSection">
      <a href="javascript:void(0)" onclick="openGoogleForm()" class="btn-action bg-emerald" style="margin-bottom: 10px;">
        📝 กรอก Google Form เพื่อบันทึกสถิติ
      </a>
      <p style="text-align: center; color: #64748b; font-size: 11px; margin-bottom: 10px;">* กรอกฟอร์มแล้วกดปุ่มด้านล่างเพื่ออัปเดตทำเนียบ TOP 5</p>
    </div>

    <div id="leaderboardSection" style="margin-top: 10px;">
      <h3 style="color: white; font-size: 14px; font-weight: bold; margin-bottom: 8px;">🏅 ทำเนียบผู้ทำสถิติดีที่สุด TOP 5</h3>
      <div id="lbList"></div>
      
      <div style="display: flex; gap: 8px; margin-top: 15px;">
        <button onclick="restartGame()" class="btn-action bg-indigo" style="flex: 1;">🔄 เล่นต่อ / เริ่มใหม่</button>
        <button onclick="exitGame()" class="btn-action bg-rose" style="flex: 1;">❌ ออกจากเกม</button>
      </div>
    </div>
  </div>
</div>

<script>
const GOOGLE_FORM_URL = 'https://forms.gle/UwAcdEGeKHCHf28C8';
const BOARD_SIZE = 100;

const SPECIAL = {
  4: { target: 24, type: 'ladder', title: '🚇 MRT', desc: 'ปฏิบัติตามระเบียบการเดินทาง MRT อย่างเคร่งครัด (+20 ช่อง)', id: '1bLOKF-rfAYmtnz5Yr-XDX0bIFtnJFlxr' },
  14: { target: 35, type: 'ladder', title: '🚪 OpenDoorGently', desc: 'เปิดประตูระมัดระวัง ไม่ก่อความเสียหายหรืออันตราย (+21 ช่อง)', id: '1sFmR4IkD_HeA6HSWpbDLFSKgtzW0k4qu' },
  28: { target: 51, type: 'ladder', title: '🔄 Reverse_OK', desc: 'ถอยรถตามขั้นตอนความปลอดภัยถูกต้อง (+23 ช่อง)', id: '1G2an1G9w9jPa-ox5Mexz4r3iA0354A47' },
  42: { target: 65, type: 'ladder', title: '📏 Distance', desc: 'เว้นระยะห่างที่ปลอดภัยในการปฏิบัติงานและขับขี่ (+23 ช่อง)', id: '1eyEWARkjy5IO898durxQQJAAvW1rEcLh' },
  58: { target: 79, type: 'ladder', title: '🛡️ SafetyBelt_OK', desc: 'คาดเข็มขัดนิรภัยทุกครั้งเมื่อปฏิบัติงานหรือเดินทาง (+21 ช่อง)', id: '1wBTW3zrDR8ydoUE9Di8qsCgcn4aB6bXr' },
  71: { target: 92, type: 'ladder', title: '📋 Tenko_OK', desc: 'ตรวจความพร้อมร่างกายและอุปกรณ์ (Tenko) ครบถ้วน (+21 ช่อง)', id: '1hX4xja7-awjmfRS45Dq7F_AFqlD4p46I' },
  
  32: { target: 10, type: 'snake', title: '🚫 Teasing', desc: 'หยอกล้อกันในพื้นที่ทำงาน เสี่ยงต่ออุบัติเหตุ (-22 ช่อง)', id: '1lr44VvniNs-KE6kFNdNbtmzHb7Riqg_W' },
  48: { target: 16, type: 'snake', title: '⚠️ Flirting', desc: 'พฤติกรรมไม่เหมาะสมในสถานที่ทำงาน (-32 ช่อง)', id: '1rH0D1VaRO-YfNCQVd21feBptr3sagBUX' },
  67: { target: 36, type: 'snake', title: '🪟 Window', desc: 'ประมาทเลินเล่อบริเวณหน้าต่างหรือพื้นที่เสี่ยง (-31 ช่อง)', id: '1B3UCv-58YqfvGevjZYWTHKWb2PRKAhdF' },
  85: { target: 53, type: 'snake', title: '👟 SlipperyShoes_NotOK', desc: 'สวมรองเท้าไม่เหมาะสม เสี่ยงต่อการลื่นไถลหกล้ม (-32 ช่อง)', id: '1qh0eBgOy5OMIWmtz0L13CNWQ_6JB2mik' },
  93: { target: 73, type: 'snake', title: '⚠️ Unsafe_Behavior', desc: 'ละเลยมาตรการความปลอดภัยในองค์กร (-20 ช่อง)', id: '1eieLuLv9fP_EKRRYf06zDuY_B-77f0sn' },
  97: { target: 62, type: 'snake', title: '🗣️ Insult_NotOK', desc: 'ใช้วาจาไม่สุภาพหรือลบหลู่ผู้อื่นในองค์กร (-35 ช่อง)', id: '18VWXBtAvEYEqtbA8X0Z8K_Rnfsot4kri' }
};

let pPos = 1, aPos = 1, turn = 1;
let isPlayerTurn = true, isProcessing = false;
let pending = null;

let audioCtx = null;
let isBgmPlaying = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  startBgmSynthesizer();
}

function startBgmSynthesizer() {
  if (isBgmPlaying || !audioCtx) return;
  isBgmPlaying = true;
  
  function playNoteLoop() {
    if (!isBgmPlaying) return;
    const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
    let now = audioCtx.currentTime;
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.03, now + idx * 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.4 + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.4);
      osc.stop(now + idx * 0.4 + 0.38);
    });
    setTimeout(playNoteLoop, 2400);
  }
  playNoteLoop();
}

function playDiceSoundSynth() {
  initAudio();
  if (!audioCtx) return;
  
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150 + Math.random() * 200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }, i * 70);
  }
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let row = 9; row >= 0; row--) {
    const even = row % 2 === 0;
    for (let col = 0; col < 10; col++) {
      const idx = even ? col : 9 - col;
      const num = row * 10 + idx + 1;
      const cell = document.createElement('div');
      cell.id = 'c' + num;
      cell.className = 'cell ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
      if (SPECIAL[num]) {
        cell.classList.add(SPECIAL[num].type === 'ladder' ? 'ladder' : 'snake');
      }
      const n = document.createElement('span');
      n.className = 'num';
      n.textContent = num;
      cell.appendChild(n);
      if (SPECIAL[num]) {
        const ic = document.createElement('span');
        ic.className = 'icon';
        ic.textContent = SPECIAL[num].type === 'ladder' ? '🪜' : '🐍';
        cell.appendChild(ic);
        const lb = document.createElement('span');
        lb.className = 'label';
        lb.textContent = '→' + SPECIAL[num].target;
        cell.appendChild(lb);
      }
      board.appendChild(cell);
    }
  }
  setTimeout(() => { drawLines(); updateTokens(); }, 100);
}

function drawLines() {
  const board = document.getElementById('board');
  const old = board.querySelector('.connector');
  if (old) old.remove();
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'connector');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const lg = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  lg.setAttribute('id', 'lg');
  lg.innerHTML = '<stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/><stop offset="100%" stop-color="#059669" stop-opacity="0.9"/>';
  defs.appendChild(lg);
  const sg = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  sg.setAttribute('id', 'sg');
  sg.innerHTML = '<stop offset="0%" stop-color="#f87171" stop-opacity="0.8"/><stop offset="100%" stop-color="#dc2626" stop-opacity="0.9"/>';
  defs.appendChild(sg);
  svg.appendChild(defs);
  
  const rect = board.getBoundingClientRect();
  if (rect.width === 0) return;
  for (const [from, info] of Object.entries(SPECIAL)) {
    const f = document.getElementById('c' + from);
    const t = document.getElementById('c' + info.target);
    if (!f || !t) continue;
    const fr = f.getBoundingClientRect();
    const tr = t.getBoundingClientRect();
    const x1 = ((fr.left + fr.width/2 - rect.left) / rect.width) * 100;
    const y1 = ((fr.top + fr.height/2 - rect.top) / rect.height) * 100;
    const x2 = ((tr.left + tr.width/2 - rect.left) / rect.width) * 100;
    const y2 = ((tr.top + tr.height/2 - rect.top) / rect.height) * 100;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', info.type === 'ladder' ? 'url(#lg)' : 'url(#sg)');
    line.setAttribute('stroke-width', info.type === 'ladder' ? '3.5' : '4');
    line.setAttribute('stroke-dasharray', info.type === 'ladder' ? 'none' : '5,4');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
  }
  board.appendChild(svg);
}

function updateTokens() {
  document.querySelectorAll('.token-player, .token-ai').forEach(el => el.remove());
  const p = document.getElementById('c' + pPos);
  if (p) {
    const tok = document.createElement('div');
    tok.className = 'token-player';
    tok.textContent = '👤';
    p.appendChild(tok);
  }
  const a = document.getElementById('c' + aPos);
  if (a) {
    const tok = document.createElement('div');
    tok.className = 'token-ai';
    tok.textContent = '🤖';
    a.appendChild(tok);
  }
  document.getElementById('pPos').textContent = pPos;
  document.getElementById('aPos').textContent = aPos;
  document.getElementById('turnCount').textContent = turn;
}

function rollDice() {
  playDiceSoundSynth();
  const val = Math.floor(Math.random() * 6) + 1;
  const icons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  const el = document.getElementById('dice');
  el.textContent = icons[val-1];
  return val;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function playTurn() {
  initAudio();
  if (isProcessing) return;
  isProcessing = true;
  const btn = document.getElementById('rollBtn');
  btn.disabled = true;
  
  if (isPlayerTurn) {
    document.getElementById('msg').textContent = '🎲 กำลังทอย...';
    const d = rollDice();
    await sleep(400);
    pPos = Math.min(BOARD_SIZE, pPos + d);
    updateTokens();
    if (!checkSpecial('Player', pPos)) nextTurn();
  }
}

function aiPlay() {
  document.getElementById('msg').textContent = '🤖 AI กำลังคิด...';
  setTimeout(async () => {
    const d = rollDice();
    await sleep(400);
    aPos = Math.min(BOARD_SIZE, aPos + d);
    updateTokens();
    if (!checkSpecial('AI', aPos)) nextTurn();
  }, 800);
}

function checkSpecial(who, pos) {
  if (SPECIAL[pos]) {
    const info = SPECIAL[pos];
    pending = () => {
      if (who === 'Player') pPos = info.target;
      else aPos = info.target;
      updateTokens();
      nextTurn();
    };
    showVideo(info, who, pos);
    return true;
  }
  return false;
}

function nextTurn() {
  if (pPos >= BOARD_SIZE || aPos >= BOARD_SIZE) {
    showResult();
    return;
  }
  if (isPlayerTurn) {
    isPlayerTurn = false;
    aiPlay();
  } else {
    isPlayerTurn = true;
    turn++;
    isProcessing = false;
    document.getElementById('rollBtn').disabled = false;
    document.getElementById('msg').textContent = '🎯 ตาของคุณแล้ว! แตะปุ่มเพื่อทอยลูกเต๋า';
  }
}

function showVideo(info, who, pos) {
  const modal = document.getElementById('videoModal');
  const diff = Math.abs(info.target - pos);
  const badge = document.getElementById('vBadge');
  const tag = document.getElementById('vTag');
  const title = document.getElementById('vTitle');
  const desc = document.getElementById('vDesc');
  const container = document.getElementById('vContainer');
  
  if (who === 'Player') {
    badge.className = 'badge badge-blue';
    badge.textContent = '👦 ผู้เล่น ตกช่องนี้';
  } else {
    badge.className = 'badge badge-pink';
    badge.textContent = '🤖 AI ตกช่องนี้';
  }
  if (info.type === 'ladder') {
    tag.className = 'badge badge-green';
    tag.textContent = '🪜 ขึ้นบันได! +' + diff + ' ช่อง';
  } else {
    tag.className = 'badge badge-red';
    tag.textContent = '🐍 ตกงู! -' + diff + ' ช่อง';
  }
  title.textContent = info.title;
  desc.textContent = info.desc;
  
  container.innerHTML = `<iframe src="https://drive.google.com/file/d/${info.id}/preview?autoplay=1" allow="autoplay; fullscreen"></iframe>`;
  modal.classList.add('active');
}

function closeVideo() {
  document.getElementById('videoModal').classList.remove('active');
  document.getElementById('vContainer').innerHTML = '';
  if (pending) { const cb = pending; pending = null; cb(); }
}

function showResult() {
  const modal = document.getElementById('resultModal');
  const icon = document.getElementById('winnerIcon');
  const title = document.getElementById('winnerTitle');
  const sub = document.getElementById('winnerSub');

  if (pPos >= BOARD_SIZE) {
    icon.textContent = '🎉🏆';
    title.textContent = 'ยินดีด้วย! คุณเป็นผู้ชนะ';
    sub.textContent = `คุณใช้จำนวนรอบทอยทั้งหมด ${turn} รอบ`;
    
    saveLocalScore('ผู้เล่น (Player)', turn);
    
    setTimeout(() => {
      openGoogleForm();
    }, 500);
  } else {
    icon.textContent = '🤖❌';
    title.textContent = 'AI เป็นผู้ชนะในรอบนี้';
    sub.textContent = 'พยายามใหม่อีกครั้งในรอบหน้านะครับ!';
  }

  updateLeaderboardUI();
  modal.classList.add('active');
}

function openGoogleForm() {
  window.open(GOOGLE_FORM_URL, '_blank');
}

function saveLocalScore(name, scoreTurn) {
  let scores = JSON.parse(localStorage.getItem('snake_scores_top5') || '[]');
  scores.push({ name: name, turns: scoreTurn, date: new Date().toLocaleDateString('th-TH') });
  scores.sort((a,b) => a.turns - b.turns);
  scores = scores.slice(0, 5);
  localStorage.setItem('snake_scores_top5', JSON.stringify(scores));
}

function updateLeaderboardUI() {
  const list = document.getElementById('lbList');
  let scores = JSON.parse(localStorage.getItem('snake_scores_top5') || '[]');
  
  if (scores.length === 0) {
    scores = [
      { name: 'Player Winner', turns: turn, date: 'วันนี้' },
      { name: 'Staff_A', turns: turn + 2, date: 'วันนี้' },
      { name: 'Staff_B', turns: turn + 4, date: 'วันนี้' }
    ];
  }
  
  list.innerHTML = scores.slice(0, 5).map((item, i) => `
    <div class="lb-item">
      <span style="font-weight:bold; color: #818cf8; width: 24px;">#${i+1}</span>
      <span style="flex:1; font-weight:600; color: white;">${esc(item.name)}</span>
      <span style="background: rgba(99, 102, 241, 0.2); padding: 2px 8px; border-radius: 12px; font-weight: bold; color: #a5b4fc;">${item.turns} รอบ</span>
    </div>
  `).join('');
}

function restartGame() {
  pPos = 1;
  aPos = 1;
  turn = 1;
  isPlayerTurn = true;
  isProcessing = false;
  document.getElementById('resultModal').classList.remove('active');
  document.getElementById('rollBtn').disabled = false;
  document.getElementById('msg').textContent = '🎯 ตาของคุณแล้ว! แตะปุ่มเพื่อทอยลูกเต๋า';
  updateTokens();
}

function exitGame() {
  document.getElementById('resultModal').classList.remove('active');
  document.getElementById('rollBtn').disabled = true;
  document.getElementById('msg').textContent = '👋 ออกจากเกมแล้ว กด "เริ่มต้นใหม่" เพื่อเล่นอีกครั้ง';
  
  const diceArea = document.querySelector('.dice-area');
  diceArea.innerHTML = `<button onclick="location.reload()" class="btn-action bg-indigo" style="width:100%;">🔄 เริ่มเกมใหม่</button>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.onload = function() {
  buildBoard();
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('click', initAudio, { once: true });
};
window.onresize = drawLines;
</script>

</body>
